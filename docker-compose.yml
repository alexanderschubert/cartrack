services:
  app:
    image: ${CARTRACK_IMAGE:-cartrack:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
    ports:
      - "${CARTRACK_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - cartrack_private:/var/www/storage/app/private
      - cartrack_public:/var/www/storage/app/public
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cartrack_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  queue:
    image: ${CARTRACK_IMAGE:-cartrack:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=90"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  cartrack_private:
  cartrack_public:
  cartrack_redis:
